# =============================================================================
# WS-5 host CI gate
#
# This workflow runs ONLY the host-runnable pytest suite (probe/contract tests
# that need no Android device). It is the automated half of milestone M5 in the
# 5-session orchestration plan (docs/research/orchestration-5session-plan.md).
#
# IMPORTANT: On-device tests are a MANUAL gate. They require a physical Android
# device (shared hardware) and are NEVER run in CI. Device evidence is recorded
# by hand per the orchestration plan's M5 milestone; this CI does not and must
# not attempt adb, APK install, or any device interaction.
# =============================================================================
name: WS-5 host tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host pytest suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run host pytest suite
        run: uvx pytest tests/ -q

      # A line that reports PASS must be able to report FAIL. Several verdicts
      # in the native report were string literals -- including one about
      # app-data exec policy that contradicted the function two above it and
      # had never asked the kernel anything.
      - name: unconditional verdict gate
        run: bash scripts/check-unconditional-verdicts.sh

      # A Git LFS pointer builds, installs, and produces an app with no rootfs;
      # a whole 1,592-line device report was captured in that state.
      - name: git-lfs materialization gate
        run: bash scripts/check-lfs-materialized.sh
